<!DOCTYPE html>

<html>

<head>

    <title>Upload Media</title>



    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">



    <style>

        body {

            background: #f5f6fa;

        }



        .upload-card {

            max-width: 500px;

            margin: auto;

            margin-top: 80px;

            padding: 30px;

            border-radius: 15px;

        }

    </style>

</head>



<body>



<div class="container">



    <div class="card upload-card shadow-sm">



        <h3 class="text-center mb-4">📤 Upload Media</h3>



        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}



            <div class="mb-3">

                {{ form.title.label_tag }}

                {{ form.title }}

            </div>



            <div class="mb-3">

                {{ form.file.label_tag }}

                {{ form.file }}

            </div>



            <button type="submit" 

        class="btn btn-primary w-100"

        onclick="return confirm('⚠️ Are you sure you want to save these changes?')">

    Save Changes

</button>



        </form>



    </div>



</div>



</body>

</html>
