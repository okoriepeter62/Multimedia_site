<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .card {
            border-radius: 15px;
        }

        .media-box img,
        .media-box video {
            max-width: 100%;
            border-radius: 10px;
        }

        .title {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/">MediaApp</a>

  <div class="ms-auto">
    <a class="btn btn-outline-light btn-sm me-2" href="/">Home</a>
    <a class="btn btn-success btn-sm me-2" href="/upload/">Upload</a>
    <a class="btn btn-warning btn-sm" href="/admin/">Admin</a>
  </div>
</nav>

<div class="container mt-4">

    <h1 class="text-center mb-4">🎬 Multimedia Gallery</h1>

    {% for item in media %}

        <div class="card mb-3 p-3 shadow-sm">

            <h4 class="title">{{ item.title }}</h4>

            <div class="media-box mb-2">

                {% if ".mp4" in item.file.url %}
                    <video controls>
                        <source src="{{ item.file.url }}">
                    </video>

                {% elif ".mp3" in item.file.url %}
                    <audio controls>
                        <source src="{{ item.file.url }}">
                    </audio>

                {% else %}
                    <img src="{{ item.file.url }}">
                {% endif %}

            </div>

            <div>
                <a class="btn btn-warning btn-sm" href="{% url 'edit' item.id %}">Edit</a>
                <a href="{% url 'delete' item.id %}" 
   onclick="return confirm('⚠️ Are you sure you want to delete this media? This action cannot be undone!')"
   class="btn btn-danger btn-sm">
   Delete
</a>
            </div>

        </div>

    {% empty %}
        <p class="text-center">No media uploaded yet.</p>
    {% endfor %}

</div>

</body>
</html>
